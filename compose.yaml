services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: design_procurement_agent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d design_procurement_agent']
      interval: 3s
      timeout: 3s
      retries: 10
volumes:
  postgres-data:
